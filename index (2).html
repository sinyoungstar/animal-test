<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나랑 닮은 동물은? · 성격 동물 테스트</title>
<meta name="description" content="질문 8개로 알아보는 나의 성격 동물과 궁합. 1분이면 끝!" />
<meta property="og:title" content="나랑 닮은 동물은? 🐾" />
<meta property="og:description" content="질문 8개면 끝! 내 성격 동물이랑 잘 맞는 동물까지 알아보기" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#EDEAF6; --card:#FFFFFF; --ink:#282343; --mut:#8A85A3;
    --accent:#5B4BE0; --line:#E4E0F0; --good:#2FA36B; --bad:#E0699B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum',system-ui,sans-serif;
    background:radial-gradient(130% 90% at 50% 0%, #F3E9FB 0%, var(--bg) 55%);
    color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .wrap{width:100%; max-width:440px;}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:26px; padding:34px 26px;
    box-shadow:0 18px 50px rgba(60,45,120,.12);
  }
  h1{font-family:'Jua',sans-serif; font-size:30px; line-height:1.25; text-align:center;}
  .sub{text-align:center; color:var(--mut); margin-top:14px; font-size:15px; line-height:1.7;}
  .hero-emoji{font-size:56px; text-align:center; margin-bottom:6px;}
  .btn{
    display:block; width:100%; margin-top:26px; padding:16px;
    font-family:'Jua',sans-serif; font-size:17px; color:#fff;
    background:var(--accent); border:none; border-radius:15px; cursor:pointer;
    transition:transform .12s, filter .12s;
  }
  .btn:hover{filter:brightness(1.05);} .btn:active{transform:scale(.98);}
  .btn.ghost{background:none; color:var(--accent); border:1.5px solid var(--line); margin-top:12px;}

  .prog{display:flex; gap:5px; margin-bottom:22px;}
  .prog i{flex:1; height:6px; border-radius:6px; background:var(--line); transition:background .2s;}
  .prog i.on{background:var(--accent);}
  .qnum{text-align:center; color:var(--mut); font-size:13px; margin-bottom:10px;}
  .q{font-family:'Jua',sans-serif; font-size:21px; line-height:1.45; text-align:center; min-height:60px; display:flex; align-items:center; justify-content:center;}
  .opts{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .opt{
    padding:15px 16px; text-align:left; font-size:15.5px; color:var(--ink);
    background:#F6F4FC; border:1.5px solid transparent; border-radius:14px; cursor:pointer;
    transition:border-color .12s, background .12s, transform .1s;
  }
  .opt:hover{border-color:var(--accent); background:#F0EDFB;}
  .opt:active{transform:scale(.99);}

  .avatar{width:132px; height:132px; margin:0 auto 4px; display:block;}
  .avatar svg{width:100%; height:100%;}
  .rname{font-family:'Jua',sans-serif; font-size:26px; text-align:center; margin-top:6px;}
  .rtag{text-align:center; color:var(--accent); font-size:14px; margin-top:6px;}
  .rdesc{margin-top:18px; font-size:15.5px; line-height:1.85; color:#4A445F;
    background:#F6F4FC; border-radius:16px; padding:20px;}

  .match{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .mrow{display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:14px; border:1.5px solid var(--line);}
  .mrow .micon{width:44px; height:44px; flex:none;}
  .mrow .micon svg{width:100%; height:100%;}
  .mlabel{font-family:'Jua',sans-serif; font-size:13px;}
  .mrow.good .mlabel{color:var(--good);}
  .mrow.bad .mlabel{color:var(--bad);}
  .mname{font-size:14.5px; margin:1px 0;}
  .mreason{font-size:12.5px; color:var(--mut); line-height:1.5;}

  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:14px;
    opacity:0; transition:all .25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .foot{text-align:center; color:var(--mut); font-size:12px; margin-top:20px;}
  .adslot{margin-top:16px;} /* 광고 자리: 애드핏/애드센스 코드를 여기 안에 */
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"></div>
  <div class="adslot"><!-- 여기에 광고 코드 --></div>
  <p class="foot">성격 동물 테스트 · 재미로 봐주세요 🐾</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 귀여운 동물 일러스트 (SVG) ---------- */
const SVG = {
  cat:`<svg viewBox="0 0 140 140"><g>
    <path d="M40 48 L33 18 L62 40 Z" fill="#F7C9A0"/><path d="M100 48 L107 18 L78 40 Z" fill="#F7C9A0"/>
    <path d="M43 43 L39 26 L56 39 Z" fill="#EFA9C0"/><path d="M97 43 L101 26 L84 39 Z" fill="#EFA9C0"/>
    <circle cx="70" cy="80" r="42" fill="#FBDCBB"/>
    <circle cx="52" cy="90" r="8" fill="#F7B7B0" opacity=".7"/><circle cx="88" cy="90" r="8" fill="#F7B7B0" opacity=".7"/>
    <circle cx="57" cy="76" r="5.5" fill="#3A3550"/><circle cx="83" cy="76" r="5.5" fill="#3A3550"/>
    <circle cx="59" cy="74" r="1.8" fill="#fff"/><circle cx="85" cy="74" r="1.8" fill="#fff"/>
    <path d="M66 88 Q70 92 74 88" stroke="#C77BA0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M70 84 l-3 4 M70 84 l3 4" stroke="#C77BA0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M40 82 H26 M42 88 H28 M100 82 H114 M98 88 H112" stroke="#E9C2A2" stroke-width="2" stroke-linecap="round"/>
  </g></svg>`,
  dog:`<svg viewBox="0 0 140 140"><g>
    <ellipse cx="36" cy="72" rx="15" ry="26" fill="#C9925C"/><ellipse cx="104" cy="72" rx="15" ry="26" fill="#C9925C"/>
    <circle cx="70" cy="76" r="42" fill="#E8BE8C"/>
    <ellipse cx="70" cy="92" rx="26" ry="20" fill="#F7E4C8"/>
    <circle cx="52" cy="94" r="7" fill="#F2A9A0" opacity=".65"/><circle cx="88" cy="94" r="7" fill="#F2A9A0" opacity=".65"/>
    <circle cx="57" cy="72" r="5.5" fill="#3A3550"/><circle cx="83" cy="72" r="5.5" fill="#3A3550"/>
    <circle cx="59" cy="70" r="1.8" fill="#fff"/><circle cx="85" cy="70" r="1.8" fill="#fff"/>
    <ellipse cx="70" cy="88" rx="7" ry="5" fill="#3A3550"/>
    <path d="M70 92 V100" stroke="#3A3550" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 100 q-8 4 -8 -3 M70 100 q8 4 8 -3" stroke="#3A3550" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M70 104 q5 6 11 4" fill="#EF9BB0"/>
  </g></svg>`,
  owl:`<svg viewBox="0 0 140 140"><g>
    <path d="M42 40 L50 24 L58 42 Z" fill="#8FB0B6"/><path d="M98 40 L90 24 L82 42 Z" fill="#8FB0B6"/>
    <ellipse cx="70" cy="80" rx="44" ry="46" fill="#A9C7CD"/>
    <ellipse cx="70" cy="92" rx="26" ry="30" fill="#CFE3E6"/>
    <circle cx="55" cy="70" r="17" fill="#fff"/><circle cx="85" cy="70" r="17" fill="#fff"/>
    <circle cx="55" cy="72" r="8" fill="#3A3550"/><circle cx="85" cy="72" r="8" fill="#3A3550"/>
    <circle cx="58" cy="69" r="2.6" fill="#fff"/><circle cx="88" cy="69" r="2.6" fill="#fff"/>
    <path d="M62 84 L70 92 L78 84 Z" fill="#F2A93D"/>
    <circle cx="42" cy="92" r="6" fill="#F2A9A0" opacity=".6"/><circle cx="98" cy="92" r="6" fill="#F2A9A0" opacity=".6"/>
  </g></svg>`,
  fox:`<svg viewBox="0 0 140 140"><g>
    <path d="M38 50 L30 20 L60 42 Z" fill="#EF9E4F"/><path d="M102 50 L110 20 L80 42 Z" fill="#EF9E4F"/>
    <path d="M41 44 L37 27 L53 41 Z" fill="#3A3550"/><path d="M99 44 L103 27 L87 41 Z" fill="#3A3550"/>
    <circle cx="70" cy="76" r="42" fill="#F2A85A"/>
    <path d="M70 66 Q44 78 52 104 Q70 116 88 104 Q96 78 70 66 Z" fill="#FBF1E4"/>
    <circle cx="57" cy="72" r="5.5" fill="#3A3550"/><circle cx="83" cy="72" r="5.5" fill="#3A3550"/>
    <circle cx="59" cy="70" r="1.8" fill="#fff"/><circle cx="85" cy="70" r="1.8" fill="#fff"/>
    <path d="M70 88 L63 96 h14 Z" fill="#3A3550"/>
    <circle cx="48" cy="90" r="6" fill="#F2A9A0" opacity=".6"/><circle cx="92" cy="90" r="6" fill="#F2A9A0" opacity=".6"/>
  </g></svg>`,
  bear:`<svg viewBox="0 0 140 140"><g>
    <circle cx="40" cy="42" r="16" fill="#C79A6B"/><circle cx="100" cy="42" r="16" fill="#C79A6B"/>
    <circle cx="40" cy="42" r="8" fill="#A87E52"/><circle cx="100" cy="42" r="8" fill="#A87E52"/>
    <circle cx="70" cy="80" r="43" fill="#D3AA79"/>
    <ellipse cx="70" cy="92" rx="24" ry="20" fill="#F0E0C8"/>
    <circle cx="56" cy="76" r="5.5" fill="#3A3550"/><circle cx="84" cy="76" r="5.5" fill="#3A3550"/>
    <circle cx="58" cy="74" r="1.8" fill="#fff"/><circle cx="86" cy="74" r="1.8" fill="#fff"/>
    <ellipse cx="70" cy="88" rx="7" ry="5" fill="#3A3550"/>
    <path d="M70 93 V98 M70 98 q-6 4 -9 0 M70 98 q6 4 9 0" stroke="#7A5C3A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="48" cy="90" r="6" fill="#F2A9A0" opacity=".55"/><circle cx="92" cy="90" r="6" fill="#F2A9A0" opacity=".55"/>
  </g></svg>`,
};

/* ---------- 질문 (8개) ---------- */
const QUESTIONS = [
  { q:"주말 약속이 갑자기 취소됐다. 나는?", a:[
    ["앗싸, 집에서 혼자 뒹굴 시간 확보!","cat"],
    ["심심한데? 다른 친구한테 바로 연락","dog"],
    ["잘됐다, 밀린 콘텐츠 정주행 각","owl"],
    ["안 쓴 돈 굳었네, 이득","fox"] ]},
  { q:"처음 가는 모임에 도착했다. 나는?", a:[
    ["일단 구석에서 분위기 관찰","owl"],
    ["먼저 다가가서 말 걸기","dog"],
    ["제일 편해 보이는 사람 옆에","bear"],
    ["누가 이 판의 키맨인지 스캔","fox"] ]},
  { q:"친구가 고민을 털어놓는다. 나는?", a:[
    ["끝까지 들어주고 무조건 편들기","bear"],
    ["현실적인 해결책을 제시","fox"],
    ["왜 그런 상황이 됐는지 분석","owl"],
    ["일단 나가서 기분부터 풀어주기","dog"] ]},
  { q:"내 여행 스타일은?", a:[
    ["계획 없이 발길 닿는 대로","cat"],
    ["다 같이 우르르 몰려다니기","dog"],
    ["동선·맛집 완벽 사전조사","owl"],
    ["가성비 루트로 알뜰하게","fox"] ]},
  { q:"스트레스를 받으면 나는?", a:[
    ["혼자만의 동굴로 잠수","cat"],
    ["수다로 다 털어버림","dog"],
    ["원인을 계속 곱씹어 분석","owl"],
    ["맛있는 거 먹고 푹 자기","bear"] ]},
  { q:"팀플에서 내 포지션은?", a:[
    ["조용히 내 몫만 확실히","cat"],
    ["분위기 메이커","dog"],
    ["자료 조사·정리 담당","owl"],
    ["역할 나누고 교통정리","fox"] ]},
  { q:"좋아하는 사람이 생기면 나는?", a:[
    ["티 안 내고 혼자 좋아함","cat"],
    ["대놓고 잘해주며 표현","dog"],
    ["상대를 오래 관찰부터","owl"],
    ["그냥 편하고 자연스럽게","bear"] ]},
  { q:"갑자기 목돈이 생겼다. 나는?", a:[
    ["나를 위한 소소한 사치","cat"],
    ["친구들이랑 신나게 쓴다","dog"],
    ["일단 저축, 계획부터","owl"],
    ["어디에 굴릴지 계산","fox"] ]},
];

/* ---------- 결과 + 궁합 ---------- */
const RESULTS = {
  cat:{ name:"마이페이스 고양이", tag:"독립적인 츤데레",
    desc:"남 눈치 안 보고 내 리듬대로 사는 타입. 혼자 있는 시간이 곧 충전이에요. 다가가긴 좀 어려워 보여도, 한번 마음을 열면 누구보다 진국인 사람. 표현은 서툴러도 정은 깊답니다.",
    match:["owl","서로의 혼자 시간을 존중해주는 찰떡 궁합"],
    clash:["dog","다가오는 텐션에 자꾸 도망가고 싶어져요"] },
  dog:{ name:"사랑둥이 강아지", tag:"모두의 에너자이저",
    desc:"사람을 좋아하고, 사람들도 당신을 좋아해요. 곁에 있으면 분위기가 환해지는 타입. 감정에 솔직하고 정이 많아서, 힘들어하는 친구를 그냥 지나치지 못하는 따뜻한 사람이에요.",
    match:["bear","다 받아주는 곰 품에서 제일 편안해져요"],
    clash:["cat","다가가도 자꾸 숨어버려서 서운할 수 있어요"] },
  owl:{ name:"신중한 부엉이", tag:"조용한 관찰자",
    desc:"말보다 생각이 먼저 나가는 사람. 조용히 다 지켜보고 있고, 한번 꽂히면 끝까지 파고드는 지식형이에요. 얕은 잡담보다 깊이 있는 대화 한 번이 훨씬 즐거운 타입이죠.",
    match:["cat","각자 파고들며 곁을 지키는 조용한 편안함"],
    clash:["dog","혼자 생각할 틈을 안 줘서 조금 지쳐요"] },
  fox:{ name:"눈치백단 여우", tag:"재치있는 전략가",
    desc:"상황 판단이 빠르고 요령이 좋은 사람. 손해 보는 걸 싫어하고 실속을 딱 챙기죠. 재치있는 한마디로 어색한 분위기를 정리하는, 은근히 없으면 아쉬운 사람이에요.",
    match:["bear","계산 없이 든든해서 곁에 있으면 마음이 놓여요"],
    clash:["cat","둘 다 속을 안 보여줘서 서로 겉돌 수 있어요"] },
  bear:{ name:"든든한 곰", tag:"느긋한 평화주의자",
    desc:"웬만해선 화도 안 내고 늘 느긋한 사람. 곁에 있으면 이상하게 마음이 편해져요. 다툼보다 평화가 좋고, 잘 먹고 잘 자는 게 세상에서 제일 중요한 진짜 어른이랍니다.",
    match:["dog","밝은 강아지 옆에서 저절로 같이 웃게 돼요"],
    clash:["owl","둘 다 먼저 안 다가가서 정적만 흐를 수 있어요"] },
};

let step = 0;
const scores = { cat:0, dog:0, owl:0, fox:0, bear:0 };
const card = document.getElementById('card');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

function renderIntro(){
  card.innerHTML = `
    <div class="hero-emoji">🐾</div>
    <h1>나랑 닮은 동물은?</h1>
    <p class="sub">질문 8개로 알아보는 나의 성격 동물과 궁합.<br>1분이면 끝나요!</p>
    <button class="btn" id="start">테스트 시작하기</button>`;
  document.getElementById('start').onclick = ()=>{ step=0; for(const k in scores) scores[k]=0; renderQ(); };
}

function renderQ(){
  const item = QUESTIONS[step];
  const bars = QUESTIONS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');
  const opts = item.a.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('');
  card.innerHTML = `<div class="prog">${bars}</div>
    <div class="qnum">${step+1} / ${QUESTIONS.length}</div>
    <div class="q">${item.q}</div><div class="opts">${opts}</div>`;
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      scores[item.a[+btn.dataset.i][1]]++;
      step++;
      if(step < QUESTIONS.length) renderQ(); else renderResult();
    };
  });
}

function renderResult(){
  let best='cat', max=-1;
  for(const k in scores){ if(scores[k]>max){ max=scores[k]; best=k; } }
  const r = RESULTS[best];
  const m = RESULTS[r.match[0]], c = RESULTS[r.clash[0]];
  card.innerHTML = `
    <div class="avatar">${SVG[best]}</div>
    <div class="rname">${r.name}</div>
    <div class="rtag">${r.tag}</div>
    <div class="rdesc">${r.desc}</div>
    <div class="match">
      <div class="mrow good">
        <div class="micon">${SVG[r.match[0]]}</div>
        <div><div class="mlabel">🤝 잘 맞는 동물</div>
          <div class="mname">${m.name}</div>
          <div class="mreason">${r.match[1]}</div></div>
      </div>
      <div class="mrow bad">
        <div class="micon">${SVG[r.clash[0]]}</div>
        <div><div class="mlabel">⚡ 안 맞는 동물</div>
          <div class="mname">${c.name}</div>
          <div class="mreason">${r.clash[1]}</div></div>
      </div>
    </div>
    <button class="btn" id="share">결과 공유하기</button>
    <button class="btn ghost" id="again">다시 하기</button>`;
  document.getElementById('again').onclick = renderIntro;
  document.getElementById('share').onclick = async ()=>{
    const text = `나는 「${r.name}」! 너랑 닮은 동물은? 👉`;
    const url = location.href;
    if(navigator.share){
      try{ await navigator.share({ title:"성격 동물 테스트", text, url }); }catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(text+" "+url); showToast("링크가 복사됐어요!"); }
      catch(e){ showToast("주소창의 링크를 복사해 공유해요"); }
    }
  };
}

renderIntro();
</script>
</body>
</html>
